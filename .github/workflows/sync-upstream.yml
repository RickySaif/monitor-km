name: Sync Umami release

# Keeps this repo at the latest stable Umami release of the same major version.
# A new major version fails on purpose and waits for a manual upgrade (see MONITOR.md).
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream-release
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Compare with latest upstream release
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(gh api repos/umami-software/umami/releases/latest --jq .tag_name)
          current=$(tr -d '[:space:]' < .github/UPSTREAM_VERSION)
          echo "latest=$latest current=$current"
          if [ -z "$latest" ]; then
            echo "::error::Could not read the latest Umami release"; exit 1
          fi
          if [ "$latest" = "$current" ]; then
            echo "Already at $current, nothing to do."
            echo "update=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          cur_major=${current#v}; cur_major=${cur_major%%.*}
          new_major=${latest#v};  new_major=${new_major%%.*}
          if [ "$cur_major" != "$new_major" ]; then
            echo "::error::Umami $latest is a new major version (current $current). Review the release notes and upgrade manually, see .github/MONITOR.md"
            exit 1
          fi
          echo "update=true" >> "$GITHUB_OUTPUT"
          echo "latest=$latest" >> "$GITHUB_OUTPUT"

      - name: Sync source from upstream tag
        if: steps.check.outputs.update == 'true'
        run: |
          git clone --depth 1 --branch "${{ steps.check.outputs.latest }}" https://github.com/umami-software/umami.git "$RUNNER_TEMP/umami"
          rsync -a --delete --exclude .git/ --exclude .github/ "$RUNNER_TEMP/umami/" ./
          echo "${{ steps.check.outputs.latest }}" > .github/UPSTREAM_VERSION

      - name: Commit and push
        if: steps.check.outputs.update == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Sync Umami ${{ steps.check.outputs.latest }}"
          git push origin HEAD:main
